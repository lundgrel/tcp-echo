# tcp-echo-server settings. Everything after a # is a comment.
ListenAddress = 0.0.0.0
Port = 5001
PushIntervalSeconds = 10
JitterFraction = 0.2
StatsIntervalSeconds = 60
MaxFrameBytes = 65536
ClosedHistoryLimit = 100
LogLevel = Information   # Trace, Debug, Information, Warning, Error, Critical, None

# Only used when running as a service:
# LogDirectory = logs
# LogRetentionDays = 14
